[package]
    edition = "2024"
    name    = "avatar-creator"
    version = "0.6.1"

[[bin]]
    name = "avatar-creator"
    path = "src/main.rs"

[dependencies]
    eframe             = { version = "0.35", default-features = false, features = ["default_fonts", "wayland", "x11", "glow"] }
    egui_extras        = { version = "0.35", features = ["file", "image"] }
    image              = { version = "0.25", default-features = false, features = ["jpeg", "png", "rayon", "webp"] }
    rfd                = { version = "0.17" }
    thiserror          = { version = "2.0" }
    tracing            = { version = "0.1", default-features = false }
    tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "fmt", "env-filter"] }
    winit              = { version = "0.30", default-features = true }

[lints.clippy]
    cast_possible_truncation = "allow"
    cast_precision_loss      = "allow"
    cast_sign_loss           = "allow"
    pedantic                 = { priority = -1, level = "deny" }
